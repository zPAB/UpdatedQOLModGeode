name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64
        - name: macOS
          os: macos-latest
        - name: iOS
          os: macos-latest
          target: iOS        

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-beta.2
          build-config: 'Release'
          export-pdb: true
          combine: true
          target: ${{ matrix.config.target }}
      
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: JPMenu-Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "JPMenu v1.0.0"
          draft: false
          prerelease: false
          files: ${{ steps.build.outputs.build-output }}/*.geode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

